openapi: 3.1.0
info:
  title: IndoAds Prompt Engine
  version: 0.3.0
  description: Search, retrieve, select and compose high-quality advertising image prompts. This API does not generate images.
servers:
  - url: https://YOUR_DOMAIN
paths:
  /api/generate:
    post:
      operationId: generateAdPrompt
      summary: Generate a final advertising image prompt in one call.
      description: Use this as the default operation when the user wants to create an advertisement or advertising visual directly. It selects the best concept internally and returns the final image-generation prompt, so no recommend/get/compose chain is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAdPromptInput'
      responses:
        '200':
          description: Final prompt and selected concept metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAdPromptResult'
        '400':
          description: Invalid or insufficient request parameters.
        '503':
          description: Prompt database unavailable.
  /api/recommend:
    post:
      operationId: recommendAdPrompts
      summary: Recommend multiple diverse advertising prompt concepts for a product.
      description: Use when the user explicitly wants concept options or wants to choose a concept. For direct ad creation, prefer generateAdPrompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchInput'
      responses:
        '200':
          description: Ranked prompt recommendations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
  /api/search:
    post:
      operationId: searchAdPrompts
      summary: Search or browse advertising prompt concepts using filters and natural language.
      description: Use for library exploration. For a direct finished ad prompt, prefer generateAdPrompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchInput'
      responses:
        '200':
          description: Ranked results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
  /api/prompts/{id}:
    get:
      operationId: getAdPrompt
      summary: Get the full structured prompt concept by a known ID.
      description: Do not call after generateAdPrompt; generateAdPrompt already returns the selected concept metadata and final prompt.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prompt template.
        '404':
          description: Prompt not found.
  /api/compose:
    post:
      operationId: composeAdPrompt
      summary: Compose a final image-generation prompt from an already selected concept ID.
      description: Use only when promptId is already known. For direct ad creation without a selected ID, prefer generateAdPrompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeInput'
      responses:
        '200':
          description: Final prompt ready to send to an image model.
        '404':
          description: Prompt ID not found.
  /api/taxonomy:
    get:
      operationId: listPromptTaxonomy
      summary: List available categories, styles, product types, objectives, platforms and ratios.
      responses:
        '200':
          description: Prompt taxonomy.
components:
  schemas:
    SearchInput:
      type: object
      properties:
        query:
          type: string
        category:
          type: string
        productType:
          type: string
        productDescription:
          type: string
        keyBenefit:
          type: string
        targetAudience:
          type: string
        objective:
          type: string
        style:
          type: string
        platform:
          type: string
        aspectRatio:
          type: string
        model:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        diversify:
          type: boolean
          default: true
    SearchResult:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        visualConcept: { type: string }
        score: { type: number }
        matchReasons:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        styleTags:
          type: array
          items: { type: string }
        productTypes:
          type: array
          items: { type: string }
        aspectRatios:
          type: array
          items: { type: string }
        qualityScore: { type: number }
    ComposeInput:
      type: object
      required: [promptId, productName]
      properties:
        promptId: { type: string }
        productName: { type: string }
        brandName: { type: string }
        productDescription: { type: string }
        keyBenefit: { type: string }
        targetAudience: { type: string }
        copyText: { type: string }
        platform: { type: string }
        aspectRatio: { type: string }
        hasReferenceImage: { type: boolean }
        extraInstructions: { type: string }
    GenerateAdPromptInput:
      type: object
      description: All fields are optional, but provide at least one product or advertising detail.
      properties:
        query: { type: string }
        category: { type: string }
        productType: { type: string }
        productName: { type: string }
        brandName: { type: string }
        productDescription: { type: string }
        keyBenefit: { type: string }
        targetAudience: { type: string }
        objective: { type: string }
        style: { type: string }
        platform: { type: string }
        aspectRatio: { type: string }
        copyText: { type: string }
        hasReferenceImage: { type: boolean }
        extraInstructions: { type: string }
    GenerateAdPromptResult:
      type: object
      required: [prompt, concept, aspectRatio, platform, recommendedModels]
      properties:
        prompt:
          type: string
          description: Final image-generation prompt ready for the image generator.
        concept:
          type: object
          required: [id, name, visualConcept, style, styleTags, objective, matchScore, matchReasons]
          properties:
            id: { type: string }
            name: { type: string }
            visualConcept: { type: string }
            style: { type: string }
            styleTags:
              type: array
              items: { type: string }
            objective: { type: string }
            matchScore: { type: number }
            matchReasons:
              type: array
              items: { type: string }
        aspectRatio: { type: string }
        platform: { type: string }
        recommendedModels:
          type: array
          items: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional. Required only if INDOADS_API_KEY is set on the server.
security:
  - bearerAuth: []
  - {}
